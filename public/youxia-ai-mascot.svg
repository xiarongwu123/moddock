  <path d="M83 165c-6 20-7 55 1 75 6 17 23 24 48 24l34-2 30 7c21 4 36-4 42-20 8-21 10-46 7-72Z" fill="url(#shell)"/>
  <path d="M87 225c12 22 33 27 59 25 24-2 32-3 50 4 17 6 31 5 39-6-8 20-23 22-39 18l-29-7-35 3c-25 0-41-6-45-37Z" fill="#81a563" opacity=".65" stroke="none"/>
  <g class="wave">
   <path d="M88 174c-11-2-17-13-21-23l-22 8c0 22 10 40 26 43 7 2 13-2 17-8" fill="url(#side)"/>
   <path d="M56 176c-11-2-22-13-24-25-2-9 4-15 12-12-4-14 1-24 10-24 10 0 14 10 13 21 10-8 19-3 17 8-1 16-14 33-28 32Z" fill="url(#shell)"/>
   <path d="M39 144c-2-4 0-6 4-6m9-15c-3 2-4 5-4 9" fill="none" stroke="#f1fac7" stroke-width="3" opacity=".8"/>
  </g>
  <path d="M85 164c19-5 48-2 80 2l78 6 15-12-1 22-16 12-79-7-77-8Z" fill="url(#side)"/>
  <path d="M215 90c30 2 45 20 47 42l1 25-23 16-36-14Z" fill="url(#side)"/>
  <path d="M84 154c-1-29 8-52 27-63 16-10 37-11 64-7l41 7c19 5 30 19 30 41l-2 28c-1 12-8 16-21 16l-57-6-30-4-15 1c-16-1-29-5-37-13Z" fill="url(#shell)"/>
  <path d="M95 119c7-20 18-28 38-30 27-2 57 4 76 8" fill="none" stroke="#f0fbc4" stroke-width="5" opacity=".7"/>
  <path d="M91 123c17-3 25-10 27-27m99 4c-10 9-9 21 0 28l25 18" fill="none" stroke="#7e9f5f" stroke-width="2.8" opacity=".65"/>
  <g class="sprout">
   <path d="M157 89c3-9 8-17 9-25-18 1-34-8-35-23-1-13 16-12 27-3 10 8 12 16 11 23 7-15 25-21 38-13 11 7-8 26-23 25-5 0-10-2-13-4-3 8-2 15 1 23-4 4-11 3-15-3Z" fill="url(#leaf)"/>
   <path d="M141 39c5-1 11 2 14 7m27 9c4-4 9-5 13-4" fill="none" stroke="#eaf7b4" stroke-width="4"/>
  </g>
  <g stroke="none">
   <ellipse cx="111" cy="146" rx="12" ry="7" fill="url(#cheek)"/><ellipse cx="210" cy="158" rx="12" ry="7" fill="url(#cheek)"/>
   <g class="pupils" fill="#20392b">
    <g class="eye"><ellipse cx="131" cy="132" rx="10" ry="15"/><ellipse cx="134" cy="127" rx="3.1" ry="4.2" fill="#f7fced"/></g>
    <g class="eye"><ellipse cx="194" cy="140" rx="10" ry="15"/><ellipse cx="197" cy="135" rx="3.1" ry="4.2" fill="#f7fced"/></g>
   </g>
  </g>
  <g class="happy-eyes" fill="none"><path d="M122 135q9-16 18 1m45 7q9-16 18 1"/></g>
