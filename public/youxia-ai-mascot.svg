<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-labelledby="title desc">
 <title id="title">匣仔 · 游匣 AI</title>
 <desc id="desc">长着嫩芽的绿色游戏小匣子，会眨眼、挥手和轻轻摇摆。支持 idle、thinking、working、happy、quiet 状态。</desc>
 <defs>
  <linearGradient id="shell" x1="0" y1="0" x2=".8" y2="1" gradientUnits="objectBoundingBox"><stop stop-color="#e1f5a3"/><stop offset=".52" stop-color="#c0df87"/><stop offset="1" stop-color="#9fbe70"/></linearGradient>
  <linearGradient id="side" x2=".8" y2="1"><stop stop-color="#95b96f"/><stop offset="1" stop-color="#658958"/></linearGradient>
  <linearGradient id="leaf" x2=".8" y2="1"><stop stop-color="#c6e799"/><stop offset="1" stop-color="#88b36b"/></linearGradient>
  <linearGradient id="lock" x2=".6" y2="1"><stop stop-color="#edf9b4"/><stop offset="1" stop-color="#bddb85"/></linearGradient>
  <radialGradient id="cheek"><stop stop-color="#ffba87" stop-opacity=".95"/><stop offset="1" stop-color="#ffb780" stop-opacity=".55"/></radialGradient>
 </defs>
 <style>
  .body { animation: breathe 3.6s ease-in-out infinite; transform-origin: 160px 258px; }
  .shadow { animation: shadow 3.6s ease-in-out infinite; transform-origin: 162px 289px; }
  .sprout { animation: sprout 3.6s ease-in-out infinite; transform-origin: 166px 96px; }
  .wave { animation: wave 6s ease-in-out infinite; transform-origin: 87px 193px; }
  .hand-right { animation: hand 3.6s ease-in-out infinite; transform-origin: 250px 207px; }
  .eye { animation: blink 5.8s infinite; transform-box: fill-box; transform-origin: center; }
  .shine { animation: glint 3.6s ease-in-out infinite; }
  .thinking-fx, .working-fx, .happy-fx, .happy-eyes { opacity: 0; }
  .dot { animation: dots 1.5s ease-in-out infinite; }
  .dot.two { animation-delay: .18s; } .dot.three { animation-delay: .36s; }
  .gear { animation: turn 6s linear infinite; transform-origin: 267px 108px; }
  .spark { animation: sparkle 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .spark.two { animation-delay: .65s; }
  #thinking:target ~ .body { animation-name: ponder; }
  #thinking:target ~ .body .wave { animation: think-hand 3.6s ease-in-out infinite; }
  #thinking:target ~ .body .pupils { transform: translate(3px, -3px); }
  #thinking:target ~ .body .thinking-fx { opacity: 1; }
  #working:target ~ .body { animation: work .85s ease-in-out infinite; }
  #working:target ~ .body .wave { animation: work-hand .85s ease-in-out infinite; }
  #working:target ~ .body .hand-right { animation: hand .85s ease-in-out infinite reverse; }
  #working:target ~ .body .working-fx { opacity: 1; }
  #happy:target ~ .body { animation: celebrate 1.6s ease-in-out infinite; }
  #happy:target ~ .body .wave { animation: happy-wave 1.1s ease-in-out infinite; }
  #happy:target ~ .body .pupils { opacity: 0; }
  #happy:target ~ .body .happy-fx, #happy:target ~ .body .happy-eyes { opacity: 1; }
  #quiet:target ~ .body, #quiet:target ~ .body *, #quiet:target ~ .shadow { animation: none; }
  @keyframes breathe { 0%, 100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-6px) rotate(1deg); } }
  @keyframes shadow { 0%, 100% { transform: scaleX(1); opacity: .14; } 50% { transform: scaleX(.88); opacity: .09; } }
  @keyframes sprout { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(6deg); } }
  @keyframes wave { 0%, 12%, 42%, 100% { transform: rotate(0); } 18%, 30% { transform: rotate(19deg); } 24%, 36% { transform: rotate(-12deg); } }
  @keyframes hand { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(5deg); } }
  @keyframes blink { 0%, 39%, 43%, 72%, 76%, 100% { transform: scaleY(1); } 41%, 74% { transform: scaleY(.08); } }
  @keyframes glint { 0%, 100% { opacity: .55; } 50% { opacity: .9; } }
  @keyframes ponder { 0%, 100% { transform: translateY(-2px) rotate(-3deg); } 50% { transform: translateY(-5px) rotate(1deg); } }
  @keyframes think-hand { 0%, 100% { transform: rotate(30deg); } 50% { transform: rotate(38deg); } }
  @keyframes dots { 0%, 70%, 100% { opacity: .3; transform: translateY(0); } 35% { opacity: 1; transform: translateY(-4px); } }
  @keyframes work { 0%, 100% { transform: translateY(-1px) rotate(-1.5deg); } 50% { transform: translateY(-4px) rotate(1.5deg); } }
  @keyframes work-hand { 0%, 100% { transform: rotate(8deg); } 50% { transform: rotate(-14deg); } }
  @keyframes turn { to { transform: rotate(360deg); } }
  @keyframes celebrate { 0%, 100% { transform: translateY(0) rotate(-2deg); } 40% { transform: translateY(-13px) rotate(3deg); } 65% { transform: translateY(-2px) rotate(-2deg); } }
  @keyframes happy-wave { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(23deg); } }
  @keyframes sparkle { 0%, 100% { transform: scale(.7); opacity: .3; } 50% { transform: scale(1.12); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .body, .body *, .shadow { animation: none !important; } }
 </style>
 <g id="idle"/><g id="thinking"/><g id="working"/><g id="happy"/><g id="quiet"/>
 <ellipse class="shadow" cx="162" cy="289" rx="92" ry="11" fill="#b9dc82" opacity=".14"/>
 <g class="body" stroke="#233c2c" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
  <g class="thinking-fx" fill="#c8e793" stroke="none">
   <circle class="dot" cx="237" cy="65" r="4"/><circle class="dot two" cx="252" cy="59" r="5"/><circle class="dot three" cx="270" cy="56" r="6"/>
  </g>
  <g class="working-fx" stroke="#b9dc82" stroke-width="3" fill="none">
   <g class="gear"><circle cx="267" cy="108" r="11"/><circle cx="267" cy="108" r="3.5"/><path d="M267 91v5m0 24v5m-17-17h5m24 0h5m-29-12 4 4m17 17 4 4m0-25-4 4m-17 17-4 4"/></g>
   <path d="m41 225-7 7 7 7m16-14 7 7-7 7" opacity=".65"/>
