  </g>
  <g fill="url(#side)">
   <path d="M104 254c-9 7-14 20-8 28 8 10 38 10 47 0 5-6 3-17-3-24Z"/>
   <path d="M193 260c-5 8-7 22 0 28 10 8 36 8 44-2 5-7 0-19-6-26Z"/>
  </g>
  <path d="M103 270c-4 6-4 12 0 14 8 5 24 4 29 0-12-1-20-6-29-14Zm95 5c-2 6-2 11 3 13 7 3 22 3 27-2-11-1-22-4-30-11Z" fill="#b4d681" stroke="none"/>
